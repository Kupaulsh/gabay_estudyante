<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gabay Estudyante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LANDING ================= -->
<div id="landing">
  <div class="landing-mark">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2 1 7l11 5 9-4.09V17h2V7L12 2zM5 13.18v4.72c0 1.15 3.13 3.1 7 3.1s7-1.95 7-3.1v-4.72L12 17l-7-3.82z"/></svg>
  </div>
  <h1>Gabay Estudyante</h1>
  <p class="sub">One place for your calendar, schedule, subjects, reviewers, and everything else — organized per school.</p>
  <div class="school-grid">
    <div class="school-card" onclick="enterApp('pccm')">
      <img class="logo" src="pccm-logo.png" alt="PCCM logo" onerror="logoFallback(this,'PCCM')">
      <h3>PCCM</h3>
      <p>BSOA – BS in Office Administration</p>
    </div>
    <div class="school-card" onclick="enterApp('tup')">
      <img class="logo" src="tup-logo.png" alt="TUP logo" onerror="logoFallback(this,'TUP')">
      <h3>TUP</h3>
      <p>BET – Electronics Technology</p>
    </div>
  </div>
  <div class="landing-foot">
    <button class="link-quiet" onclick="openSignInModal()">Admin</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="who" onclick="openSchoolMenu()" role="button" style="cursor:pointer;">
      <div class="dot" id="topSchoolDot">--</div>
      <div>
        <h2 id="topSchoolName">School <span style="color:var(--ink-soft);font-weight:400;font-size:12px;">▾</span></h2>
      </div>
    </div>
  </div>

  <div id="adminBanner">
    🔧 Admin Mode — you can add, edit, and delete content on this page
    <button onclick="signOutAdmin()">Exit</button>
  </div>

  <main id="pageContent"></main>
</div>

<!-- Gear nav -->
<div id="gearScrim" onclick="closeGear()"></div>
<div id="gearNav">
  <div id="gearItems"></div>
  <button id="gearBtn" onclick="toggleGear()" aria-label="Menu">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.68 8.87a.5.5 0 0 0 .12.61l2.03 1.58c-.05.3-.08.62-.08.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.14.24.42.32.66.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.51 0 .65-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
  </button>
</div>

<!-- Modal -->
<div class="modal-scrim" id="modalScrim" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<!-- Supabase client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="notifications.js"></script>
<script src="admin.js"></script>
</body>
</html>
