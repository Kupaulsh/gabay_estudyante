<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gabay Estudyante</title>
<meta name="theme-color" content="#F6F5F0">
<script>
/* apply saved text size + color mode before first paint */
try{var _t=localStorage.getItem('shTheme'),_f=parseInt(localStorage.getItem('shFont'),10);
if(_t==='dark'){document.documentElement.setAttribute('data-theme','dark');var _m=document.querySelector('meta[name=theme-color]');if(_m)_m.setAttribute('content','#14181A');}
if(_f>=12&&_f<=24)document.documentElement.style.setProperty('--fs',_f/16);}catch(e){}
</script>
<link rel="icon" type="image/png" href="GaEs_Icon.png">
<link rel="apple-touch-icon" href="GaEs_Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LANDING ================= -->
<div id="landing">
  <div class="landing-mark">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2 1 7l11 5 9-4.09V17h2V7L12 2zM5 13.18v4.72c0 1.15 3.13 3.1 7 3.1s7-1.95 7-3.1v-4.72L12 17l-7-3.82z"/></svg>
  </div>
  <h1>Gabay Estudyante</h1>
  <p class="sub">One place for your calendar, schedule, subjects, reviewers, and everything else — organized per school.</p>
  <div class="school-grid" id="schoolGrid"></div>
  <div class="landing-foot">
    <button class="link-quiet" id="landingAuthBtn" onclick="openSignInModal()">Sign in</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="who">
      <div class="dot" id="topSchoolDot">--</div>
      <div class="who-text">
        <h2 id="topSchoolName">School</h2>
        <div class="top-sem" id="topSemester"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="sync-dot online" id="syncDot" onclick="showSyncStatus()" aria-label="Online" title="Online"></button>
      <button id="editBtn" class="off" onclick="toggleEditMode()" aria-label="Turn editing on" title="Editing is off">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
    </div>
  </div>

  <main id="pageContent"></main>
</div>

<div id="pomoBanner" class="pomo-banner" role="alert"></div>
<div id="toast" role="status"></div>

<!-- Bottom menu (icons only) -->
<nav id="bottomNav" aria-label="Main menu"></nav>

<!-- Modal -->
<div class="modal-scrim" id="modalScrim" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<!-- Supabase client library -->
<script src="vendor-supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="data.js"></script>
<script src="study.js"></script>
<script src="app.js"></script>
<script src="notifications.js"></script>
<script src="admin.js"></script>
</body>
</html>
